name: Pull mirror from school repo

on:
  schedule:
    - cron: "*/15 * * * *"  # toutes les 15 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo miroir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer main depuis le repo de l'école et le pousser ici
        env:
          SCHOOL_READ_TOKEN: ${{ secrets.SCHOOL_READ_TOKEN }}
        run: |
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${SCHOOL_READ_TOKEN}" fetch https://github.com/EpitechBachelorPromo2028/B-SPE-331-RUN-3-1-kaiju-1.git main
          git push origin FETCH_HEAD:main --force
